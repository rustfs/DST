[workspace]
resolver = "3"
members = [
    "crates/rustfs-dst-runtime",
    "crates/rustfs-dst-faults",
    "crates/rustfs-dst-sim",
    "crates/rustfs-dst-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/rustfs/DST"
homepage = "https://rustfs.com"
authors = ["RustFS Team <hello@rustfs.com>"]
rust-version = "1.88.0"

[workspace.dependencies]
rustfs-dst-runtime = { path = "crates/rustfs-dst-runtime", version = "0.1.0" }
rustfs-dst-faults = { path = "crates/rustfs-dst-faults", version = "0.1.0" }
rustfs-dst-sim = { path = "crates/rustfs-dst-sim", version = "0.1.0" }

async-trait = "0.1"
bytes = { version = "1", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rand_chacha = "0.9"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turmoil = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(madsim)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
